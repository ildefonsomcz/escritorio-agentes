# Escritório dos Agentes (F2J) — roda na mesma máquina do n8n.
#
#   1. cp .env.exemplo .env   e preencha (URL e chave do Supabase do Cérebro, usuário e hash da senha)
#   2. node scripts/gerar-senha.mjs        gera o HABBLAUD_REMOTE_PASSWORD_HASH para o .env
#   3. docker compose up -d --build
#   4. no proxy do servidor (o mesmo do n8n), aponte o subdomínio para 127.0.0.1:4748 (veja INSTALAR-NO-SERVIDOR.md)
#
# Duas portas, as duas presas ao 127.0.0.1 do servidor (nada fica aberto direto para a internet):
#   4747  sem login, só para quem já está dentro do servidor (teste rápido com curl / túnel SSH)
#   4748  com login (usuário e senha do .env): é esta que o proxy publica com HTTPS
name: escritorio-agentes

services:
  escritorio:
    build: .
    image: escritorio-agentes:local
    container_name: escritorio-agentes
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ESCRITORIO_PORTA_LOCAL:-4747}:4747"
      - "127.0.0.1:${ESCRITORIO_PORTA:-4748}:4748"
    volumes:
      - escritorio-data:/data
    environment:
      TZ: ${TZ:-America/Maceio}
      HABBLAUD_SOURCE: cerebro
      CEREBRO_SUPABASE_URL: ${CEREBRO_SUPABASE_URL:?defina CEREBRO_SUPABASE_URL no .env}
      CEREBRO_SUPABASE_KEY: ${CEREBRO_SUPABASE_KEY:?defina CEREBRO_SUPABASE_KEY no .env}
      CEREBRO_POLL_MS: ${CEREBRO_POLL_MS:-3000}
      CEREBRO_TIMEOUT_MIN: ${CEREBRO_TIMEOUT_MIN:-5}
      # nome público (subdomínio) aceito no cabeçalho Host
      HABBLAUD_ALLOWED_HOSTS: ${ESCRITORIO_DOMINIO:-}
      # login da porta 4748; o HTTPS fica com o proxy do servidor
      HABBLAUD_REMOTE_USER: ${HABBLAUD_REMOTE_USER:?defina HABBLAUD_REMOTE_USER no .env}
      HABBLAUD_REMOTE_PASSWORD_HASH: ${HABBLAUD_REMOTE_PASSWORD_HASH:?gere com node scripts/gerar-senha.mjs}
      HABBLAUD_REMOTE_INSECURE_HTTP: "1"
      HABBLAUD_REMOTE_ALLOW: none
      HABBLAUD_WORLD: "0"
      HABBLAUD_UPDATE_CHECK: "0"
      HABBLAUD_CODEX: "0"
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true

volumes:
  escritorio-data:
