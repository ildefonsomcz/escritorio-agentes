# Servidor do n8n da F2J: o n8n.f2jsolucoes.com.br está atrás de um Traefik em Docker (o modelo oficial de
# docker-compose do n8n, que usa o certresolver "mytlschallenge" e o entrypoint "websecure").
# Use junto com o docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.traefik.yml up -d --build
# Ajuste no .env: ESCRITORIO_DOMINIO e TRAEFIK_REDE (a rede docker do Traefik; veja INSTALAR-NO-SERVIDOR.md).
services:
  escritorio:
    networks:
      - default
      - traefik
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${TRAEFIK_REDE:-traefik}
      traefik.http.routers.escritorio.rule: Host(`${ESCRITORIO_DOMINIO}`)
      traefik.http.routers.escritorio.entrypoints: ${TRAEFIK_ENTRYPOINT:-websecure}
      traefik.http.routers.escritorio.tls.certresolver: ${TRAEFIK_CERT:-mytlschallenge}
      # a porta com login (o Traefik faz o HTTPS)
      traefik.http.services.escritorio.loadbalancer.server.port: "4748"

networks:
  traefik:
    external: true
    name: ${TRAEFIK_REDE:-traefik}
